name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  test:
    name: Verify the tagged commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,scrapers]"

      - run: ruff check src/backend tests
      - run: pytest tests -q

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      # `secrets` is not an allowed context in a step `if:`, so the presence of
      # the token is checked in the shell instead.
      - name: Upload to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          if [ -z "${TWINE_PASSWORD}" ]; then
            echo "::notice::PYPI_TOKEN is not set, so the package was built but not uploaded."
            exit 0
          fi
          python -m pip install --upgrade twine
          twine upload --non-interactive dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  image:
    name: Publish the container image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      # arm64 as well as amd64. Most of the computers this app is for are Apple
      # Silicon, and a single-architecture image means running it under emulation
      # there — several times slower, on the machine least able to spare it.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push both architectures
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Create the GitHub release
    runs-on: ubuntu-latest
    needs: publish
    steps:
      # Explicit destination: upload-artifact stores the matched files at the
      # artifact's root (the common parent is stripped), so without this the
      # files land in the working directory and "files: dist/*" matches nothing.
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
