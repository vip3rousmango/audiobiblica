name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,scrapers]"

      - name: Lint with ruff
        run: ruff check src/backend tests

      - name: Run tests
        run: pytest tests -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check and build
        run: npm run build

  docker:
    name: Packaged bundle
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build the bundle
        run: docker compose build

      - name: Start the bundle
        run: docker compose up -d

      - name: Wait for health
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then
              echo "healthy after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::the bundle did not become healthy within 60s"
          docker compose logs audiobiblica
          exit 1

      - name: Assert the UI is served from the same port
        run: curl -fsS http://127.0.0.1:8000/ | grep -q AudioBiblica

      - name: Assert a deep link falls back to the UI
        run: curl -fsS http://127.0.0.1:8000/library | grep -q AudioBiblica

      - name: Assert the API answers from the same port
        run: curl -fsS http://127.0.0.1:8000/api/v1/equipment | grep -q '"equipment"'

      - name: Tear down
        if: always()
        run: docker compose down -v
