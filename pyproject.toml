[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "audiobiblica"
version = "0.1.7"
description = "Audio equipment knowledge management system with PDF processing, manufacturer scraping, and MCP integration"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "AudioBiblica contributors" },
]
keywords = [
    "audio",
    "music",
    "studio",
    "manuals",
    "knowledge-base",
    "sqlite",
    "local-first",
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Sound/Audio",
]

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pdfminer.six>=2022.11.1",
    "PyPDF2>=3.0",
    "pydantic>=2.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "mcp>=1.28,<2",
    "segno>=1.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "black>=24.0",
    "ruff>=0.4",
    "mypy>=1.10",
]
scrapers = [
    "firecrawl-py>=4.0",
]
full = [
    "audiobiblica[dev,scrapers]",
]

[project.urls]
Homepage = "https://github.com/vip3rousmango/audiobiblica"
Repository = "https://github.com/vip3rousmango/audiobiblica"
Issues = "https://github.com/vip3rousmango/audiobiblica/issues"
Documentation = "https://github.com/vip3rousmango/audiobiblica/blob/main/docs/DEVELOPMENT.md"

[tool.hatch.build.targets.wheel]
packages = ["src/backend"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's documented idiom is a call in the parameter default.
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"