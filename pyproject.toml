[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "audiobiblica"
version = "0.1.0"
description = "Audio equipment knowledge management system with PDF processing, manufacturer scraping, and MCP integration"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Professional :: Audio Engineers",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pdfminer.six>=2022.11.1",
    "PyPDF2>=3.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "black>=24.0",
    "ruff>=0.4",
    "mypy>=1.10",
]
scrapers = [
    "firecrawl-core>=0.27",
]
mcp = [
    "mcppython>=0.17.0",
]
full = [
    "audiobiblica[dev,scrapers,mcp]",
]

[project.scripts]
audiobiblica = "src.backend.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/backend"]