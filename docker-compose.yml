# Docker Compose for development
version: '3.8'

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./src/backend:/app/src/backend
      - ./tests:/app/tests
      - ./uploads:/app/uploads
    environment:
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY}
      - ENVIRONMENT=development
    depends_on:
      - postgres

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=audiobiblica
      - POSTGRES_USER=audiobiblica
      - POSTGRES_PASSWORD=dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
